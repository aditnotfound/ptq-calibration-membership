[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "calibtrace"
version = "0.1.0"
description = "Calibration-membership pilot for post-training quantized neural artifacts"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pillow>=10.0",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "torch>=2.5",
]

[project.optional-dependencies]
gptq = [
  "llmcompressor==0.13.0",
  "transformers>=5.14,<5.15",
]
autoround = [
  "auto-round==0.14.2",
  "transformers>=5.14,<5.15",
]
paper = [
  "matplotlib>=3.10",
]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
