seed: 20260911

# Hard exchangeable-record control with no record-specific nonce or private token support.
gptq_attack:
  model: facebook/opt-125m
  seed: 20260911
  record_seed: 20260912
  calibration_size: 128
  sequence_length: 512
  bits: 4
  targets: 32
  reference_records: 16
  shadow_artifacts: 32
  test_artifacts: 16
  pool_size: 1024
  group_size: 128
  pipeline: sequential
  ignore: [lm_head]
  record_source: synthetic
  record_vocabulary_size: 512
  record_topic_size: 512
  record_concentration: 50.0
  record_nonce_length: 0
  score_chunk: 4
  output_chunk: 2
  track_changed_fraction: false
  max_new_artifacts: 1
  manifest: results/gptq_homogeneous_no_nonce_population.json
  scores: results/gptq_homogeneous_no_nonce_scores.jsonl
  report: reports/gptq_homogeneous_no_nonce_report.md
  logistic_regularization: [1.0, 0.1, 0.01, 0.001]
  candidate_crossfit_folds: 2
  candidate_crossfit_seed: 20260913
  bootstrap_replicates: 1000
  bootstrap_seed: 20260914
  randomization_replicates: 10000
  randomization_seed: 20260915
